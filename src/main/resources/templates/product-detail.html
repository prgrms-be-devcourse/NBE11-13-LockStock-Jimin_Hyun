<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 상세</title>
    <link rel="stylesheet" th:href="@{/css/detail.css}">
    <!-- auth.css나 detail.css를 따로 만드셨다면 연결 -->
</head>
<body>

<div class="product-detail-container" th:data-id="${id}">
    <!-- 상품 정보 영역 -->
    <div class="detail-top">
        <img id="thumbnail" src="" alt="상품 이미지">
        <div class="info-area">
            <h2 id="name">상품명</h2>
            <p id="price">가격: 0원</p>
            <p id="stock">재고: 0개</p>
            <p id="contents">상품 설명이 들어갑니다.</p>

            <!-- 수량 선택 영역 -->
            <div class="quantity-control">
                <button type="button" id="minusBtn">-</button>
                <input type="number" id="quantity" value="1" min="1">
                <button type="button" id="plusBtn">+</button>
            </div>

            <!-- 버튼 영역 -->
            <div class="btn-area">
                <button id="addCartBtn">장바구니 담기</button>
                <!-- 수정 버튼: JS에서 세션 정보와 비교 후 표시 -->
                <button id="editBtn" style="display:none;" th:onclick="|location.href='@{/products/edit/{id}(id=${id})}'|">상품 수정</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- 상세 페이지 전용 JS 파일 -->
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/productDetail.js}"></script>
</body>
</html>
